[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freightpipe"
version = "0.1.0"
description = "Headless freight document normalization API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.30.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/freightpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
